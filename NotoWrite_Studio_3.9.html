    <!-- HAUPTSKRIPT DER ANWENDUNG -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // DOM-Referenzen
            const visualEditor = document.getElementById('visual-editor');
            const markdownEditor = document.getElementById('markdown-editor');
            const visualPane = document.getElementById('visual-pane');
            const markdownPane = document.getElementById('markdown-pane');
            const docFilename = document.getElementById('doc-filename');
            const fileInput = document.getElementById('file-input');
            const dropOverlay = document.getElementById('drop-overlay');

            // Formatvorlagen-Buttons
            const btnTplP = document.getElementById('tpl-p');
            const btnTplH1 = document.getElementById('tpl-h1');
            const btnTplH2 = document.getElementById('tpl-h2');
            const btnTplH3 = document.getElementById('tpl-h3');
            const btnTplOl = document.getElementById('tpl-ol');
            const btnTplUl = document.getElementById('tpl-ul');
            const formatButtons = [btnTplP, btnTplH1, btnTplH2, btnTplH3, btnTplOl, btnTplUl];

            // Weitere Toolbar-Elemente
            const btnBold = document.getElementById('btn-bold');
            const btnItalic = document.getElementById('btn-italic');
            const codeLangSelect = document.getElementById('code-lang-select');
            const btnInsertCode = document.getElementById('btn-insert-code');
            const btnDetectCode = document.getElementById('btn-detect-code');

            // Statusleiste
            const statusBlock = document.getElementById('status-block');
            const statusCodeCount = document.getElementById('status-code-count');
            const statWords = document.getElementById('stat-words');
            const statChars = document.getElementById('stat-chars');
            const statLines = document.getElementById('stat-lines');

            // Modal-Elemente
            const codeModal = document.getElementById('code-modal');
            const modalLangSelect = document.getElementById('modal-lang-select');
            const modalCodeInput = document.getElementById('modal-code-input');
            const btnCloseModal = document.getElementById('btn-close-modal');
            const btnCancelModal = document.getElementById('btn-cancel-modal');
            const btnConfirmCode = document.getElementById('btn-confirm-code');

            // Navigator-Elemente
            const btnNavigator = document.getElementById('btn-navigator');
            const navigatorModal = document.getElementById('navigator-modal');
            const btnCloseNavigator = document.getElementById('btn-close-navigator');
            const navigatorList = document.getElementById('navigator-list');
            const navigatorCount = document.getElementById('navigator-count');

            let savedSelectionRange = null;
            let isSyncing = false;
            let currentViewMode = 'visual';

            // =========================================================================
            // 1. TURNDOWN (HTML -> MARKDOWN) & MARKED (MARKDOWN -> HTML) KONFIGURATION
            // =========================================================================
            const turndownService = new TurndownService({
                headingStyle: 'atx',
                bulletListMarker: '-',
                codeBlockStyle: 'fenced'
            });

            // Spezielle Regel für Listeneinträge mit Überschrift-Formatvorlage (H1, H2, H3 in <ol>/<ul>)
            turndownService.addRule('styledListItem', {
                filter: function (node) {
                    if (node.nodeName !== 'LI') return false;
                    const tpl = node.getAttribute('data-tpl');
                    const headingChild = node.querySelector('h1, h2, h3');
                    return Boolean(tpl && ['H1', 'H2', 'H3'].includes(tpl)) || Boolean(headingChild);
                },
                replacement: function (content, node, options) {
                    const tpl = (node.getAttribute('data-tpl') || (node.querySelector('h1, h2, h3') ? node.querySelector('h1, h2, h3').tagName : 'P')).toUpperCase();
                    const cleanText = content.replace(/^#+\s*/, '').trim();
                    const parent = node.parentNode;
                    let prefix = options.bulletListMarker + ' ';
                    if (parent && parent.nodeName === 'OL') {
                        const start = parent.getAttribute('start');
                        const index = Array.prototype.indexOf.call(parent.children, node);
                        const num = (start ? Number(start) + index : index + 1);
                        prefix = num + '. ';
                    }
                    if (tpl === 'H1') return '# ' + prefix + cleanText + '\n\n';
                    if (tpl === 'H2') return '## ' + prefix + cleanText + '\n\n';
                    if (tpl === 'H3') return '### ' + prefix + cleanText + '\n\n';
                    return prefix + cleanText + '\n';
                }
            });

            // Spezielle Regel für hervorgehobene Code-Blöcke (<pre><code class="language-xyz">)
            turndownService.addRule('highlightedCodeBlock', {
                filter: function (node) {
                    return node.nodeName === 'PRE' && node.firstChild && node.firstChild.nodeName === 'CODE';
                },
                replacement: function (content, node) {
                    const codeNode = node.firstChild;
                    const langAttr = node.getAttribute('data-lang') || '';
                    const classMatch = (codeNode.className || '').match(/language-(\S+)/);
                    let lang = classMatch ? classMatch[1] : langAttr.toLowerCase();
                    if (lang === 'auto' || lang === 'code' || lang === 'text') lang = '';
                    const rawCode = codeNode.textContent.replace(/\n$/, '');
                    return '\n\n```' + lang + '\n' + rawCode + '\n```\n\n';
                }
            });

            marked.setOptions({
                gfm: true,
                breaks: true
            });

            // =========================================================================
            // 2. SYNTAX-HIGHLIGHTING & AUTOMATISCHE CODE-ERKENNUNG
            // =========================================================================
            function highlightAllCodeBlocks(forceAutoDetect = false) {
                const preBlocks = visualEditor.querySelectorAll('pre');
                
                preBlocks.forEach(pre => {
                    let codeEl = pre.querySelector('code');
                    if (!codeEl) {
                        codeEl = document.createElement('code');
                        codeEl.textContent = pre.textContent;
                        pre.innerHTML = '';
                        pre.appendChild(codeEl);
                    }

                    const rawCode = codeEl.textContent;
                    const existingLangMatch = (codeEl.className || '').match(/language-([a-zA-Z0-9_-]+)/);
                    let chosenLang = existingLangMatch ? existingLangMatch[1] : (pre.getAttribute('data-lang') || '');

                    if (forceAutoDetect && codeLangSelect.value !== 'auto') {
                        chosenLang = codeLangSelect.value;
                    }

                    if (chosenLang && chosenLang !== 'auto' && hljs.getLanguage(chosenLang)) {
                        const result = hljs.highlight(rawCode, { language: chosenLang, ignoreIllegals: true });
                        codeEl.innerHTML = result.value;
                        codeEl.className = `hljs language-${chosenLang}`;
                        pre.setAttribute('data-lang', chosenLang.toUpperCase());
                    } else {
                        const autoResult = hljs.highlightAuto(rawCode);
                        const detectedLang = autoResult.language || 'code';
                        codeEl.innerHTML = autoResult.value;
                        codeEl.className = `hljs language-${detectedLang}`;
                        pre.setAttribute('data-lang', detectedLang.toUpperCase());
                    }
                });

                updateStats();
            }

            /**
             * Erkennt getippte Markdown-Codeblöcke (```sprache ... ```) oder
             * markierten Code direkt im visuellen Editor und wandelt sie um.
             */
            function detectAndConvertInlineMarkdownCode() {
                const htmlContent = visualEditor.innerHTML;
                const fenceRegex = /```([a-zA-Z0-9_-]*)\s*<br\s*\/?>([\s\S]*?)```/gi;

                if (fenceRegex.test(htmlContent)) {
                    visualEditor.innerHTML = htmlContent.replace(fenceRegex, (match, lang, innerHtml) => {
                        const tempDiv = document.createElement('div');
                        tempDiv.innerHTML = innerHtml
                            .replace(/<br\s*\/?>/gi, '\n')
                            .replace(/<\/p>\s*<p>/gi, '\n')
                            .replace(/<\/div>\s*<div>/gi, '\n');
                        const cleanCode = tempDiv.textContent.trim();
                        const langClass = lang ? `language-${lang.toLowerCase()}` : '';
                        const dataLang = lang ? lang.toUpperCase() : 'AUTO';
                        const escaped = escapeHtml(cleanCode);
                        return `<pre data-lang="${dataLang}"><code class="${langClass}">${escaped}</code></pre>`;
                    });
                }

                const paragraphs = Array.from(visualEditor.querySelectorAll('p, div'));
                let inFence = false;
                let fenceLang = '';
                let collectedLines = [];
                let nodesToRemove = [];

                for (const p of paragraphs) {
                    const txt = p.textContent.trim();
                    if (!inFence && txt.startsWith('```')) {
                        inFence = true;
                        fenceLang = txt.slice(3).trim();
                        collectedLines = [];
                        nodesToRemove.push(p);
                    } else if (inFence) {
                        if (txt.endsWith('```')) {
                            const lastLine = txt.slice(0, -3);
                            if (lastLine) collectedLines.push(lastLine);
                            
                            const pre = document.createElement('pre');
                            const code = document.createElement('code');
                            if (fenceLang) {
                                code.className = `language-${fenceLang.toLowerCase()}`;
                                pre.setAttribute('data-lang', fenceLang.toUpperCase());
                            }
                            code.textContent = collectedLines.join('\n');
                            pre.appendChild(code);

                            p.parentNode.insertBefore(pre, nodesToRemove[0]);
                            nodesToRemove.push(p);
                            nodesToRemove.forEach(n => n.remove());

                            inFence = false;
                            nodesToRemove = [];
                            collectedLines = [];
                        } else {
                            collectedLines.push(p.textContent);
                            nodesToRemove.push(p);
                        }
                    }
                }

                const sel = window.getSelection();
                if (sel && sel.rangeCount > 0 && !sel.isCollapsed && visualEditor.contains(sel.anchorNode)) {
                    const selectedText = sel.toString().trim();
                    if (selectedText.length > 0) {
                        insertHighlightedCodeBlock(selectedText, codeLangSelect.value);
                        showToast('Markierung als Code formatiert');
                        return;
                    }
                }

                highlightAllCodeBlocks(true);
                syncVisualToMarkdown();
                showToast('Code erkannt & farbig markiert');
            }

            // =========================================================================
            // 3. FORMATIERUNGSVORLAGEN & NUMMERIERUNG (Kombinierbar für Std, H1, H2, H3, Listen)
            // =========================================================================
            function placeCursorAtEnd(el) {
                if (!el) return;
                const range = document.createRange();
                range.selectNodeContents(el);
                range.collapse(false);
                const sel = window.getSelection();
                if (sel) {
                    sel.removeAllRanges();
                    sel.addRange(range);
                }
            }

            // Ermittelt das aktuelle <li>-Element, falls sich der Cursor in einer Liste befindet
            function getCurrentListItem() {
                const sel = window.getSelection();
                if (!sel || sel.rangeCount === 0) return null;
                let node = sel.anchorNode;
                if (!node) return null;
                if (node.nodeType === Node.TEXT_NODE) node = node.parentNode;
                while (node && node !== visualEditor) {
                    if (node.tagName === 'LI') return node;
                    node = node.parentNode;
                }
                return null;
            }

            // Ermittelt die Formatvorlage (P, H1, H2, H3) einer Zeile oder eines Listeneintrags
            function getEffectiveTemplate(blockNode) {
                if (!blockNode) return 'P';
                const li = blockNode.tagName === 'LI' ? blockNode : blockNode.closest('li');
                if (li) {
                    const tplAttr = (li.getAttribute('data-tpl') || '').toUpperCase();
                    if (['H1', 'H2', 'H3', 'P'].includes(tplAttr)) return tplAttr;
                    const headingChild = li.querySelector('h1, h2, h3');
                    if (headingChild) return headingChild.tagName.toUpperCase();
                    return 'P';
                }
                if (['H1', 'H2', 'H3'].includes(blockNode.tagName)) {
                    return blockNode.tagName;
                }
                return 'P';
            }

            // Setzt die Formatvorlage (P, H1, H2, H3) innerhalb eines <li>-Elements, sodass sich auch die Nummerierung anpasst
            function setListItemTemplate(li, tpl) {
                const upperTpl = (tpl || 'P').toUpperCase();
                const existingHeading = li.querySelector('h1, h2, h3, p');
                const innerHtml = existingHeading ? existingHeading.innerHTML : li.innerHTML;

                if (['H1', 'H2', 'H3'].includes(upperTpl)) {
                    li.setAttribute('data-tpl', upperTpl);
                    const tag = upperTpl.toLowerCase();
                    li.innerHTML = `<${tag}>${innerHtml}</${tag}>`;
                    placeCursorAtEnd(li.firstElementChild || li);
                } else {
                    li.removeAttribute('data-tpl');
                    li.innerHTML = innerHtml;
                    placeCursorAtEnd(li);
                }
            }

            // Nummeriert Überschriften-Listen (H1, H2, H3) im Dokument fortlaufend
            function refreshHeadingListNumbering() {
                let h1Count = 0;
                let h2Count = 0;
                let h3Count = 0;

                Array.from(visualEditor.children).forEach(child => {
                    if (child.tagName === 'H1') {
                        h2Count = 0;
                        h3Count = 0;
                    } else if (child.tagName === 'H2') {
                        h3Count = 0;
                    } else if (child.tagName === 'OL') {
                        const items = Array.from(child.children).filter(c => c.tagName === 'LI');
                        if (items.length === 0) return;
                        const firstTpl = getEffectiveTemplate(items[0]);
                        const allSameHeading = ['H1', 'H2', 'H3'].includes(firstTpl) && items.every(li => getEffectiveTemplate(li) === firstTpl);

                        if (allSameHeading) {
                            if (firstTpl === 'H1') {
                                child.setAttribute('start', String(h1Count + 1));
                                h1Count += items.length;
                                h2Count = 0;
                                h3Count = 0;
                            } else if (firstTpl === 'H2') {
                                child.setAttribute('start', String(h2Count + 1));
                                h2Count += items.length;
                                h3Count = 0;
                            } else if (firstTpl === 'H3') {
                                child.setAttribute('start', String(h3Count + 1));
                                h3Count += items.length;
                            }
                        } else {
                            child.removeAttribute('start');
                        }
                    }
                });
            }

            // Schaltet die Nummerierung (OL) oder Aufzählung (UL) unter Beibehaltung der Formatvorlage (Std, H1, H2, H3) um
            function toggleListForCurrentBlock(listTag) {
                const li = getCurrentListItem();
                if (li) {
                    const parentList = li.parentElement;
                    const currentTpl = getEffectiveTemplate(li);

                    if (parentList && parentList.tagName === listTag) {
                        // Liste für diese Zeile aufheben, aber Formatvorlage (P, H1, H2, H3) beibehalten!
                        const blockTag = ['H1', 'H2', 'H3'].includes(currentTpl) ? currentTpl.toLowerCase() : 'p';
                        const newBlock = document.createElement(blockTag);
                        const innerTarget = li.querySelector('h1, h2, h3, p') || li;
                        newBlock.innerHTML = innerTarget.innerHTML || '<br>';

                        const items = Array.from(parentList.children).filter(c => c.tagName === 'LI');
                        const idx = items.indexOf(li);

                        if (items.length === 1) {
                            parentList.replaceWith(newBlock);
                        } else if (idx === 0) {
                            parentList.before(newBlock);
                            li.remove();
                        } else if (idx === items.length - 1) {
                            parentList.after(newBlock);
                            li.remove();
                        } else {
                            const afterList = document.createElement(parentList.tagName.toLowerCase());
                            items.slice(idx + 1).forEach(afterLi => afterList.appendChild(afterLi));
                            li.remove();
                            parentList.after( newBlock, afterList );
                        }
                        placeCursorAtEnd(newBlock);
                    } else if (parentList) {
                        // Zwischen OL und UL wechseln, Formatvorlage (P, H1, H2, H3) aller Einträge behalten
                        const newList = document.createElement(listTag.toLowerCase());
                        while (parentList.firstChild) {
                            newList.appendChild(parentList.firstChild);
                        }
                        parentList.replaceWith(newList);
                        placeCursorAtEnd(li.querySelector('h1, h2, h3, p') || li);
                    }
                    return;
                }

                // Aktueller Block ist noch keine Liste (z. B. H1, H2, H3 oder P)
                let block = getCurrentBlockElement();
                if (!block || block.tagName === 'PRE') {
                    document.execCommand(listTag === 'OL' ? 'insertOrderedList' : 'insertUnorderedList', false, null);
                    return;
                }

                const tpl = getEffectiveTemplate(block);
                const listEl = document.createElement(listTag.toLowerCase());
                const newLi = document.createElement('li');
                newLi.innerHTML = block.innerHTML || '<br>';
                setListItemTemplate(newLi, tpl);
                listEl.appendChild(newLi);

                // Falls direkt davor oder danach eine gleichartige Liste liegt (für Standard-Absätze), zusammenführen
                const prev = block.previousElementSibling;
                if (prev && prev.tagName === listTag && tpl === 'P' && !prev.querySelector('li[data-tpl]')) {
                    prev.appendChild(newLi);
                    block.remove();
                    placeCursorAtEnd(newLi);
                } else {
                    block.replaceWith(listEl);
                    placeCursorAtEnd(newLi.querySelector('h1, h2, h3') || newLi);
                }
            }

            function applyTemplate(templateType) {
                visualEditor.focus();

                if (templateType === 'OL' || templateType === 'UL') {
                    toggleListForCurrentBlock(templateType);
                } else {
                    const li = getCurrentListItem();
                    if (li) {
                        // Wenn Zeile bereits nummeriert/aufgezählt ist: Formatvorlage der Zeile + Nummer anpassen!
                        setListItemTemplate(li, templateType);
                    } else {
                        document.execCommand('formatBlock', false, `<${templateType}>`);
                    }
                }

                refreshHeadingListNumbering();
                updateActiveFormatState();
                syncVisualToMarkdown();
                updateStats();
            }

            btnTplP.addEventListener('click', () => applyTemplate('P'));
            btnTplH1.addEventListener('click', () => applyTemplate('H1'));
            btnTplH2.addEventListener('click', () => applyTemplate('H2'));
            btnTplH3.addEventListener('click', () => applyTemplate('H3'));
            btnTplOl.addEventListener('click', () => applyTemplate('OL'));
            btnTplUl.addEventListener('click', () => applyTemplate('UL'));

            btnBold.addEventListener('click', () => {
                visualEditor.focus();
                document.execCommand('bold', false, null);
                syncVisualToMarkdown();
            });

            btnItalic.addEventListener('click', () => {
                visualEditor.focus();
                document.execCommand('italic', false, null);
                syncVisualToMarkdown();
            });

            function getCurrentBlockElement() {
                const sel = window.getSelection();
                if (!sel || sel.rangeCount === 0) return null;
                let node = sel.anchorNode;
                if (!node) return null;
                if (node.nodeType === Node.TEXT_NODE) node = node.parentNode;

                while (node && node !== visualEditor) {
                    if (['P', 'H1', 'H2', 'H3', 'UL', 'OL', 'LI', 'PRE'].includes(node.tagName)) {
                        return node;
                    }
                    node = node.parentNode;
                }
                return null;
            }

            function updateActiveFormatState() {
                formatButtons.forEach(btn => btn.classList.remove('active'));
                const block = getCurrentBlockElement();

                if (!block) {
                    btnTplP.classList.add('active');
                    statusBlock.textContent = 'Standard';
                    return;
                }

                if (block.tagName === 'PRE') {
                    const lang = block.getAttribute('data-lang') || 'CODE';
                    statusBlock.textContent = `Code (${lang})`;
                    return;
                }

                const li = getCurrentListItem();
                const tpl = getEffectiveTemplate(li || block);

                const tplNames = {
                    'P': 'Standard',
                    'H1': 'Überschrift 1',
                    'H2': 'Überschrift 2',
                    'H3': 'Überschrift 3'
                };

                // Aktive Formatvorlage (Std, H1, H2, H3) hervorheben
                if (tpl === 'H1') btnTplH1.classList.add('active');
                else if (tpl === 'H2') btnTplH2.classList.add('active');
                else if (tpl === 'H3') btnTplH3.classList.add('active');
                else btnTplP.classList.add('active');

                // Falls zusätzlich Nummerierung oder Aufzählung aktiv ist, auch diesen Button hervorheben
                if (li && li.parentElement) {
                    const listTag = li.parentElement.tagName;
                    if (listTag === 'OL') {
                        btnTplOl.classList.add('active');
                        statusBlock.textContent = `${tplNames[tpl]} + Nummerierung`;
                    } else if (listTag === 'UL') {
                        btnTplUl.classList.add('active');
                        statusBlock.textContent = `${tplNames[tpl]} + Liste`;
                    } else {
                        statusBlock.textContent = tplNames[tpl];
                    }
                } else {
                    statusBlock.textContent = tplNames[tpl];
                }
            }

            // Auf Android-Geräten aktualisiert selectionchange den Format-Status zuverlässig bei Touch
            document.addEventListener('selectionchange', () => {
                if (document.activeElement === visualEditor) {
                    updateActiveFormatState();
                }
            });

            // =========================================================================
            // 4. CODE-BLOCK EINFÜGEN & MODAL-STEUERUNG
            // =========================================================================
            function insertHighlightedCodeBlock(codeString, lang = 'auto') {
                visualEditor.focus();
                if (savedSelectionRange) {
                    const sel = window.getSelection();
                    sel.removeAllRanges();
                    sel.addRange(savedSelectionRange);
                    savedSelectionRange = null;
                }

                const pre = document.createElement('pre');
                const code = document.createElement('code');
                code.textContent = codeString;

                if (lang && lang !== 'auto') {
                    code.className = `language-${lang}`;
                    pre.setAttribute('data-lang', lang.toUpperCase());
                } else {
                    pre.setAttribute('data-lang', 'AUTO');
                }

                pre.appendChild(code);

                const sel = window.getSelection();
                if (sel && sel.rangeCount > 0 && visualEditor.contains(sel.anchorNode)) {
                    const range = sel.getRangeAt(0);
                    range.deleteContents();
                    range.insertNode(pre);

                    const nextP = document.createElement('p');
                    nextP.innerHTML = '<br>';
                    pre.insertAdjacentElement('afterend', nextP);

                    const newRange = document.createRange();
                    newRange.setStart(nextP, 0);
                    newRange.collapse(true);
                    sel.removeAllRanges();
                    sel.addRange(newRange);
                } else {
                    visualEditor.appendChild(pre);
                    const nextP = document.createElement('p');
                    nextP.innerHTML = '<br>';
                    visualEditor.appendChild(nextP);
                }

                highlightAllCodeBlocks();
                syncVisualToMarkdown();
            }

            btnInsertCode.addEventListener('click', () => {
                const sel = window.getSelection();
                if (sel && sel.rangeCount > 0 && visualEditor.contains(sel.anchorNode)) {
                    savedSelectionRange = sel.getRangeAt(0).cloneRange();
                    const selectedText = sel.toString().trim();
                    if (selectedText.length > 0) {
                        insertHighlightedCodeBlock(selectedText, codeLangSelect.value);
                        showToast('Als Code-Block formatiert');
                        return;
                    }
                }
                modalLangSelect.value = codeLangSelect.value;
                modalCodeInput.value = '';
                codeModal.classList.remove('hidden');
                codeModal.classList.add('flex');
                setTimeout(() => modalCodeInput.focus(), 50);
            });

            function closeCodeModal() {
                codeModal.classList.add('hidden');
                codeModal.classList.remove('flex');
            }

            btnCloseModal.addEventListener('click', closeCodeModal);
            btnCancelModal.addEventListener('click', closeCodeModal);
            btnConfirmCode.addEventListener('click', () => {
                const codeText = modalCodeInput.value;
                if (codeText.trim().length > 0) {
                    insertHighlightedCodeBlock(codeText, modalLangSelect.value);
                    showToast('Code eingefügt & hervorgehoben');
                }
                closeCodeModal();
            });

            btnDetectCode.addEventListener('click', detectAndConvertInlineMarkdownCode);

            codeLangSelect.addEventListener('change', () => {
                const block = getCurrentBlockElement();
                if (block && block.tagName === 'PRE') {
                    const codeEl = block.querySelector('code');
                    if (codeEl) {
                        const newLang = codeLangSelect.value;
                        codeEl.className = newLang === 'auto' ? '' : `language-${newLang}`;
                        block.setAttribute('data-lang', newLang.toUpperCase());
                        highlightAllCodeBlocks();
                        syncVisualToMarkdown();
                        updateActiveFormatState();
                    }
                }
            });

            // =========================================================================
            // 5. SYNCHRONISIERUNG ZWISCHEN VISUELLEM EDITOR UND MARKDOWN
            // =========================================================================
            function syncVisualToMarkdown() {
                if (isSyncing) return;
                isSyncing = true;
                try {
                    const md = turndownService.turndown(visualEditor.innerHTML);
                    markdownEditor.value = md;
                    updateMarkdownLineNumbers();
                } catch (err) {
                    console.error('Markdown-Konvertierungsfehler:', err);
                }
                isSyncing = false;
            }

            function upgradeNumberedHeadingsInDom() {
                const headings = Array.from(visualEditor.querySelectorAll('h1, h2, h3'));
                headings.forEach(h => {
                    if (h.closest('li')) return;
                    const text = h.textContent || '';
                    const match = text.match(/^(\d+)\.\s+([\s\S]*)$/);
                    if (match) {
                        const tpl = h.tagName.toUpperCase();
                        // Entferne führende "1. " aus dem ersten Textknoten und wandle in nummerierte Überschrift um
                        const walker = document.createTreeWalker(h, NodeFilter.SHOW_TEXT, null);
                        const firstTextNode = walker.nextNode();
                        if (firstTextNode) {
                            firstTextNode.nodeValue = firstTextNode.nodeValue.replace(/^\s*\d+\.\s+/, '');
                        }
                        const ol = document.createElement('ol');
                        const li = document.createElement('li');
                        li.setAttribute('data-tpl', tpl);
                        const innerH = document.createElement(tpl.toLowerCase());
                        innerH.innerHTML = h.innerHTML;
                        li.appendChild(innerH);
                        ol.appendChild(li);
                        h.replaceWith(ol);
                    }
                });
                refreshHeadingListNumbering();
            }

            function renderMarkdownToVisual(mdText) {
                if (isSyncing) return;
                isSyncing = true;
                try {
                    const rawHtml = marked.parse(mdText);
                    visualEditor.innerHTML = rawHtml;
                    upgradeNumberedHeadingsInDom();
                    highlightAllCodeBlocks();
                } catch (err) {
                    console.error('HTML-Renderfehler:', err);
                }
                isSyncing = false;
                updateStats();
            }

            visualEditor.addEventListener('input', () => {
                refreshHeadingListNumbering();
                syncVisualToMarkdown();
                updateStats();
            });

            visualEditor.addEventListener('keyup', (e) => {
                updateActiveFormatState();
                if (e.key === 'Enter') {
                    const html = visualEditor.innerHTML;
                    if (html.includes('```') && (html.match(/```/g) || []).length >= 2) {
                        detectAndConvertInlineMarkdownCode();
                    }
                }
            });

            visualEditor.addEventListener('mouseup', updateActiveFormatState);

            visualEditor.addEventListener('keydown', (e) => {
                const block = getCurrentBlockElement();
                if (block && block.tagName === 'PRE') {
                    if (e.key === 'Tab') {
                        e.preventDefault();
                        document.execCommand('insertText', false, '    ');
                    } else if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        document.execCommand('insertLineBreak');
                    }
                }
            });

            const markdownMirror = document.getElementById('markdown-mirror');
            const markdownLineNumbersInner = document.getElementById('markdown-line-numbers-inner');

            // Synchronisiert die vertikale Scroll-Position der Zeilennummern exakt mit dem Textarea (in jedem Ansichtsmodus)
            function syncGutterScroll() {
                if (markdownLineNumbersInner) {
                    markdownLineNumbersInner.style.transform = `translateY(-${markdownEditor.scrollTop}px)`;
                }
            }

            // Berechnet für jede logische Zeile die exakte Höhe im Textarea (inkl. automatischem Zeilenumbruch)
            // und verankert jede Zeilennummer exakt auf derselben Schrift-Grundlinie (Baseline) wie der Text im Textarea.
            function updateMarkdownLineNumbers() {
                if (!markdownLineNumbersInner || !markdownMirror) return;

                const text = markdownEditor.value || '';
                const lines = text.split('\n');

                // Exakte Typografie- und Box-Werte direkt vom Textarea übernehmen
                const computed = window.getComputedStyle(markdownEditor);
                const padLeft = parseFloat(computed.paddingLeft) || 0;
                const padRight = parseFloat(computed.paddingRight) || 0;
                const contentWidth = markdownEditor.clientWidth - padLeft - padRight;

                // Synchronisiere Font, Zeilenhöhe und Padding 1:1 auf den Zeilennummern-Container
                markdownLineNumbersInner.style.fontFamily = computed.fontFamily;
                markdownLineNumbersInner.style.fontSize = computed.fontSize;
                markdownLineNumbersInner.style.lineHeight = computed.lineHeight;
                markdownLineNumbersInner.style.paddingTop = computed.paddingTop;
                markdownLineNumbersInner.style.paddingBottom = computed.paddingBottom;

                if (contentWidth > 0) {
                    markdownMirror.style.width = `${contentWidth}px`;
                    markdownMirror.style.fontFamily = computed.fontFamily;
                    markdownMirror.style.fontSize = computed.fontSize;
                    markdownMirror.style.fontWeight = computed.fontWeight;
                    markdownMirror.style.lineHeight = computed.lineHeight;
                    markdownMirror.style.letterSpacing = computed.letterSpacing;
                    markdownMirror.style.wordSpacing = computed.wordSpacing;
                    markdownMirror.style.tabSize = computed.tabSize;
                    markdownMirror.style.whiteSpace = 'pre-wrap';
                    markdownMirror.style.overflowWrap = 'break-word';
                    markdownMirror.style.wordBreak = 'normal';
                }

                // Baue für jede Zeile ein Mess-Element im Mirror, falls die Ansicht sichtbar ist
                const isVisible = contentWidth > 0;
                let mirrorHtml = '';
                if (isVisible) {
                    for (let i = 0; i < lines.length; i++) {
                        let lineContent = lines[i].length > 0 ? escapeHtml(lines[i]) : '&#8203;';
                        // Falls eine Zeile mit Leerzeichen endet, im Mirror geschütztes Leerzeichen anhängen, damit Umbruch wie im Textarea erfolgt
                        if (lineContent.endsWith(' ')) {
                            lineContent = lineContent.slice(0, -1) + '&nbsp;';
                        }
                        mirrorHtml += `<div>${lineContent}</div>`;
                    }
                    markdownMirror.innerHTML = mirrorHtml;
                }

                const mirrorChildren = isVisible ? markdownMirror.children : [];
                let gutterHtml = '';

                // Ermittle die aktuelle Cursor-Zeile (0-basiert) im Rohdaten-Editor
                const activeLineIdx = getActiveMarkdownLineIndex();

                for (let i = 0; i < Math.max(1, lines.length); i++) {
                    let heightStyle = '';
                    if (isVisible && mirrorChildren[i]) {
                        const h = mirrorChildren[i].getBoundingClientRect().height;
                        if (h > 0) {
                            heightStyle = `style="height:${h}px;"`;
                        }
                    }
                    const isActive = (i === activeLineIdx);
                    const rowClass = isActive
                        ? 'text-right -mx-1.5 sm:-mx-2.5 px-1.5 sm:px-2.5 bg-blue-500/15 border-r-2 border-blue-400 transition-colors'
                        : 'text-right -mx-1.5 sm:-mx-2.5 px-1.5 sm:px-2.5 border-r-2 border-transparent transition-colors';
                    const spanClass = isActive
                        ? 'text-[0.82em] text-blue-400 font-bold'
                        : 'text-[0.8em] text-slate-400/90 font-normal';

                    // WICHTIG: Kein Flexbox mit leading-none! Ein normaler Block-Container erbt exakt die Zeilenhöhe (Strut) des Textareas,
                    // wodurch das Inline-Span automatisch auf derselben Schrift-Baseline wie die erste Zeile des Textarea-Absatzes sitzt.
                    gutterHtml += `<div data-line-idx="${i}" ${heightStyle} class="${rowClass}"><span class="${spanClass}">${i + 1}</span></div>`;
                }

                markdownLineNumbersInner.innerHTML = gutterHtml;
                syncGutterScroll();
            }

            // Berechnet den 0-basierten Zeilenindex der aktuellen Cursorposition im Rohdaten-Textarea
            function getActiveMarkdownLineIndex() {
                if (!markdownEditor) return 0;
                const pos = markdownEditor.selectionStart || 0;
                const textUpToCursor = (markdownEditor.value || '').slice(0, pos);
                return textUpToCursor.split('\n').length - 1;
            }

            // Aktualisiert schnell und leichtgewichtig die Hervorhebung der aktiven Zeilennummer bei Cursor-Bewegung
            function highlightActiveMarkdownLineNumber() {
                if (!markdownLineNumbersInner) return;
                const activeIdx = getActiveMarkdownLineIndex();
                const rows = markdownLineNumbersInner.children;
                for (let i = 0; i < rows.length; i++) {
                    const row = rows[i];
                    const span = row.firstElementChild;
                    if (!span) continue;
                    if (i === activeIdx) {
                        row.className = 'text-right -mx-1.5 sm:-mx-2.5 px-1.5 sm:px-2.5 bg-blue-500/15 border-r-2 border-blue-400 transition-colors';
                        span.className = 'text-[0.82em] text-blue-400 font-bold';
                    } else {
                        row.className = 'text-right -mx-1.5 sm:-mx-2.5 px-1.5 sm:px-2.5 border-r-2 border-transparent transition-colors';
                        span.className = 'text-[0.8em] text-slate-400/90 font-normal';
                    }
                }
            }

            // Bei Größenänderung des Fensters oder des Textareas Zeilenhöhen neu abgleichen
            if (typeof ResizeObserver !== 'undefined') {
                const ro = new ResizeObserver(() => {
                    if (!markdownPane.classList.contains('hidden')) {
                        updateMarkdownLineNumbers();
                    }
                });
                ro.observe(markdownEditor);
            } else {
                window.addEventListener('resize', updateMarkdownLineNumbers);
            }

            markdownEditor.addEventListener('input', () => {
                updateMarkdownLineNumbers();
                renderMarkdownToVisual(markdownEditor.value);
            });

            ['click', 'keyup', 'mouseup', 'focus', 'select'].forEach(evtName => {
                markdownEditor.addEventListener(evtName, highlightActiveMarkdownLineNumber);
            });

            // Synchronisiertes Scrollen:
            // 1. Zeilennummern laufen IMMER exakt mit dem Rohdaten-Textarea mit (auch im reinen MD-Modus)
            // 2. Im Split-Modus bewegen sich beide Frames (Visuell & Rohdaten) gemeinsam nach oben und unten
            let isScrollingSync = false;

            visualPane.addEventListener('scroll', () => {
                if (currentViewMode !== 'split' || isScrollingSync) return;
                isScrollingSync = true;
                const maxVisual = visualPane.scrollHeight - visualPane.clientHeight;
                const maxMd = markdownEditor.scrollHeight - markdownEditor.clientHeight;
                const scrollPercentage = maxVisual > 0 ? (visualPane.scrollTop / maxVisual) : 0;
                markdownEditor.scrollTop = scrollPercentage * Math.max(0, maxMd);
                syncGutterScroll();
                requestAnimationFrame(() => { isScrollingSync = false; });
            });

            markdownEditor.addEventListener('scroll', () => {
                // Zeilennummern immer sofort synchron mitbewegen
                syncGutterScroll();

                if (currentViewMode !== 'split' || isScrollingSync) return;
                isScrollingSync = true;
                const maxMd = markdownEditor.scrollHeight - markdownEditor.clientHeight;
                const maxVisual = visualPane.scrollHeight - visualPane.clientHeight;
                const scrollPercentage = maxMd > 0 ? (markdownEditor.scrollTop / maxMd) : 0;
                visualPane.scrollTop = scrollPercentage * Math.max(0, maxVisual);
                requestAnimationFrame(() => { isScrollingSync = false; });
            });

            // =========================================================================
            // 6. DATEI ÖFFNEN & SPEICHERN (.TXT, .MD und .ODT)
            // =========================================================================
            document.getElementById('btn-open').addEventListener('click', () => {
                fileInput.value = '';
                fileInput.click();
            });

            fileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) loadFileIntoEditor(file);
            });

            // Entpackt eine Datei aus einem ZIP/ODT-ArrayBuffer (JSZip oder nativer DecompressionStream/Store-Fallback)
            async function extractXmlFromOdtBuffer(arrayBuffer, targetPath) {
                if (typeof JSZip !== 'undefined') {
                    const zip = await JSZip.loadAsync(arrayBuffer);
                    const entry = zip.file(targetPath);
                    if (entry) return await entry.async('string');
                }

                // Nativer Fallback-Unzipper (unterstützt STORE [0] und DEFLATE [8] via DecompressionStream)
                const bytes = new Uint8Array(arrayBuffer);
                const view = new DataView(arrayBuffer);
                const decoder = new TextDecoder('utf-8');

                let eocdOffset = -1;
                for (let i = bytes.length - 22; i >= Math.max(0, bytes.length - 65557); i--) {
                    if (view.getUint32(i, true) === 0x06054b50) {
                        eocdOffset = i;
                        break;
                    }
                }
                if (eocdOffset === -1) throw new Error('Ungültiges ZIP/ODT-Archiv');

                const totalEntries = view.getUint16(eocdOffset + 10, true);
                let cdOffset = view.getUint32(eocdOffset + 16, true);

                for (let i = 0; i < totalEntries; i++) {
                    if (view.getUint32(cdOffset, true) !== 0x02014b50) break;
                    const compressionMethod = view.getUint16(cdOffset + 10, true);
                    const compressedSize = view.getUint32(cdOffset + 20, true);
                    const fileNameLen = view.getUint16(cdOffset + 28, true);
                    const extraLen = view.getUint16(cdOffset + 30, true);
                    const commentLen = view.getUint16(cdOffset + 32, true);
                    const localHeaderOffset = view.getUint32(cdOffset + 42, true);

                    const fileName = decoder.decode(bytes.subarray(cdOffset + 46, cdOffset + 46 + fileNameLen));
                    if (fileName === targetPath) {
                        const localNameLen = view.getUint16(localHeaderOffset + 26, true);
                        const localExtraLen = view.getUint16(localHeaderOffset + 28, true);
                        const dataStart = localHeaderOffset + 30 + localNameLen + localExtraLen;
                        const compressedData = bytes.subarray(dataStart, dataStart + compressedSize);

                        if (compressionMethod === 0) {
                            return decoder.decode(compressedData);
                        } else if (compressionMethod === 8 && typeof DecompressionStream !== 'undefined') {
                            const ds = new DecompressionStream('deflate-raw');
                            const writer = ds.writable.getWriter();
                            writer.write(compressedData);
                            writer.close();
                            const resp = new Response(ds.readable);
                            const decompressedBuf = await resp.arrayBuffer();
                            return decoder.decode(decompressedBuf);
                        }
                    }
                    cdOffset += 46 + fileNameLen + extraLen + commentLen;
                }
                return null;
            }

            // Analysiert die Stil-Definitionen in styles.xml und content.xml eines ODT-Dokuments
            function collectOdtStyleMap(xmlDoc) {
                const styleMap = {};
                if (!xmlDoc) return styleMap;

                const styleNodes = xmlDoc.getElementsByTagName('style:style');
                for (let i = 0; i < styleNodes.length; i++) {
                    const s = styleNodes[i];
                    const name = s.getAttribute('style:name');
                    if (!name) continue;

                    const parentName = s.getAttribute('style:parent-style-name') || '';
                    const displayName = s.getAttribute('style:display-name') || '';
                    const outlineLevel = s.getAttribute('style:default-outline-level') || '';

                    let bold = false;
                    let italic = false;
                    let monospace = false;
                    let isCodeBlock = false;
                    let isCodeHeader = false;
                    let headingLevel = 0;

                    if (outlineLevel === '1' || /^(Heading_20_1|Heading 1|Überschrift 1)$/i.test(name) || /^(Heading 1|Überschrift 1)$/i.test(displayName)) {
                        headingLevel = 1;
                    } else if (outlineLevel === '2' || /^(Heading_20_2|Heading 2|Überschrift 2)$/i.test(name) || /^(Heading 2|Überschrift 2)$/i.test(displayName)) {
                        headingLevel = 2;
                    } else if (outlineLevel === '3' || /^(Heading_20_3|Heading 3|Überschrift 3)$/i.test(name) || /^(Heading 3|Überschrift 3)$/i.test(displayName)) {
                        headingLevel = 3;
                    }

                    if (name === 'Code_Block' || /code_block|preformatted|vorformatiert/i.test(name) || /code_block|preformatted/i.test(parentName)) {
                        isCodeBlock = true;
                    }
                    if (name === 'Code_Header') {
                        isCodeHeader = true;
                    }
                    if (name === 'T_InlineCode') {
                        monospace = true;
                    }

                    const textProps = s.getElementsByTagName('style:text-properties')[0];
                    if (textProps) {
                        const fw = textProps.getAttribute('fo:font-weight') || textProps.getAttribute('style:font-weight-asian') || '';
                        const fs = textProps.getAttribute('fo:font-style') || textProps.getAttribute('style:font-style-asian') || '';
                        const fn = textProps.getAttribute('style:font-name') || textProps.getAttribute('fo:font-family') || '';

                        if (fw === 'bold' || Number(fw) >= 600) bold = true;
                        if (fs === 'italic' || fs === 'oblique') italic = true;
                        if (/mono|courier|consolas|fira code|jetbrains/i.test(fn)) monospace = true;
                    }

                    styleMap[name] = { parentName, headingLevel, bold, italic, monospace, isCodeBlock, isCodeHeader };
                }

                // Eltern-Stile (z. B. Heading_20_1 -> abgeleiteter automatischer Stil P1) vererben
                Object.keys(styleMap).forEach(key => {
                    const st = styleMap[key];
                    let currParent = st.parentName;
                    let depth = 0;
                    while (currParent && styleMap[currParent] && depth < 5) {
                        const p = styleMap[currParent];
                        if (!st.headingLevel && p.headingLevel) st.headingLevel = p.headingLevel;
                        if (p.bold) st.bold = true;
                        if (p.italic) st.italic = true;
                        if (p.monospace) st.monospace = true;
                        if (p.isCodeBlock) st.isCodeBlock = true;
                        if (p.isCodeHeader) st.isCodeHeader = true;
                        currParent = p.parentName;
                        depth++;
                    }
                });

                // Zusätzlich Listen-Stile (<text:list-style>) auswerten (Geordnet vs. Ungeordnet)
                const listStyleNodes = xmlDoc.getElementsByTagName('text:list-style');
                for (let i = 0; i < listStyleNodes.length; i++) {
                    const ls = listStyleNodes[i];
                    const name = ls.getAttribute('style:name');
                    if (!name) continue;
                    const hasNumberLevel = ls.getElementsByTagName('text:list-level-style-number').length > 0;
                    const isOrderedName = /^(L_Number|Numbering|Nummerierung)/i.test(name);
                    styleMap[name] = {
                        ...(styleMap[name] || {}),
                        isOrderedList: hasNumberLevel || isOrderedName
                    };
                }

                return styleMap;
            }

            // Konvertiert ODF-Inline-Elemente (<text:span>, <text:s>, <text:tab>, <text:line-break>, <text:a>) in HTML
            function parseOdtInlineNodes(parentNode, styleMap, rawTextMode = false) {
                let result = '';
                parentNode.childNodes.forEach(child => {
                    if (child.nodeType === Node.TEXT_NODE) {
                        result += rawTextMode ? child.nodeValue : escapeHtml(child.nodeValue);
                    } else if (child.nodeType === Node.ELEMENT_NODE) {
                        const localName = child.localName || child.nodeName.replace(/^.*:/, '');
                        if (localName === 's') {
                            const count = parseInt(child.getAttribute('text:c') || '1', 10);
                            const spaces = ' '.repeat(Math.max(1, count));
                            result += rawTextMode ? spaces : spaces;
                        } else if (localName === 'tab') {
                            result += '    ';
                        } else if (localName === 'line-break') {
                            result += rawTextMode ? '\n' : '<br>';
                        } else if (localName === 'span') {
                            const styleName = child.getAttribute('text:style-name') || '';
                            const st = styleMap[styleName] || {};
                            const inner = parseOdtInlineNodes(child, styleMap, rawTextMode);

                            if (rawTextMode) {
                                result += inner;
                            } else if (st.monospace || styleName === 'T_InlineCode') {
                                result += `<code>${inner}</code>`;
                            } else if ((st.bold && st.italic) || styleName === 'T_BoldItalic') {
                                result += `<strong><em>${inner}</em></strong>`;
                            } else if (st.bold || styleName === 'T_Bold') {
                                result += `<strong>${inner}</strong>`;
                            } else if (st.italic || styleName === 'T_Italic') {
                                result += `<em>${inner}</em>`;
                            } else {
                                result += inner;
                            }
                        } else {
                            result += parseOdtInlineNodes(child, styleMap, rawTextMode);
                        }
                    }
                });
                return result;
            }

            // Lädt und konvertiert eine LibreOffice Writer (.odt) Datei in den visuellen Editor
            async function loadOdtFileIntoEditor(file) {
                try {
                    const arrayBuffer = await file.arrayBuffer();
                    const contentXmlStr = await extractXmlFromOdtBuffer(arrayBuffer, 'content.xml');
                    if (!contentXmlStr) {
                        throw new Error('content.xml konnte in der ODT-Datei nicht gelesen werden.');
                    }
                    const stylesXmlStr = await extractXmlFromOdtBuffer(arrayBuffer, 'styles.xml');

                    const parser = new DOMParser();
                    const contentDoc = parser.parseFromString(contentXmlStr, 'application/xml');
                    const stylesDoc = stylesXmlStr ? parser.parseFromString(stylesXmlStr, 'application/xml') : null;

                    const styleMap = {
                        ...collectOdtStyleMap(stylesDoc),
                        ...collectOdtStyleMap(contentDoc)
                    };

                    const officeText = contentDoc.getElementsByTagName('office:text')[0];
                    if (!officeText) {
                        throw new Error('Kein Textkörper (office:text) in der ODT-Datei gefunden.');
                    }

                    const htmlBlocks = [];
                    let pendingCodeLang = null;
                    let pendingCodeLines = [];

                    function flushPendingCodeBlock() {
                        if (pendingCodeLines.length > 0) {
                            const lang = (pendingCodeLang || 'AUTO').toUpperCase();
                            const langClass = lang !== 'AUTO' && lang !== 'CODE' ? `language-${lang.toLowerCase()}` : '';
                            const codeText = escapeHtml(pendingCodeLines.join('\n'));
                            htmlBlocks.push(`<pre data-lang="${escapeHtml(lang)}"><code class="${langClass}">${codeText}</code></pre>`);
                            pendingCodeLines = [];
                            pendingCodeLang = null;
                        }
                    }

                    function processOdtContainer(containerNode) {
                        Array.from(containerNode.childNodes).forEach(node => {
                            if (node.nodeType !== Node.ELEMENT_NODE) return;
                            const localName = node.localName || node.nodeName.replace(/^.*:/, '');
                            const styleName = node.getAttribute('text:style-name') || '';
                            const st = styleMap[styleName] || {};

                            // 1. Code-Header / Code-Block aus NotoWrite oder LibreOffice "Vorformatiert"
                            if (localName === 'p' && (st.isCodeHeader || styleName === 'Code_Header')) {
                                flushPendingCodeBlock();
                                const rawHeader = parseOdtInlineNodes(node, styleMap, true).trim();
                                const match = rawHeader.match(/^\[(.+)\]$/);
                                pendingCodeLang = match ? match[1] : 'AUTO';
                                return;
                            }

                            if (localName === 'p' && (st.isCodeBlock || styleName === 'Code_Block')) {
                                const codeLine = parseOdtInlineNodes(node, styleMap, true);
                                pendingCodeLines.push(codeLine);
                                return;
                            }

                            // Falls zuvor ein Code-Block gesammelt wurde, jetzt abschließen
                            flushPendingCodeBlock();

                            // 2. Überschriften (<text:h> oder Absatz mit Überschrift-Stil)
                            if (localName === 'h' || (localName === 'p' && st.headingLevel > 0)) {
                                const levelAttr = parseInt(node.getAttribute('text:outline-level') || st.headingLevel || '1', 10);
                                const level = Math.min(3, Math.max(1, levelAttr));
                                const innerHtml = parseOdtInlineNodes(node, styleMap, false);
                                if (innerHtml.trim()) {
                                    htmlBlocks.push(`<h${level}>${innerHtml}</h${level}>`);
                                }
                                return;
                            }

                            // 3. Listen (<text:list> – Geordnete Liste <ol> oder Ungeordnete Liste <ul> inkl. Überschrift-Vorlagen)
                            if (localName === 'list') {
                                const listItems = [];
                                const isOrdered = Boolean(
                                    (st && st.isOrderedList) ||
                                    /^(L_Number|Numbering|Nummerierung)/i.test(styleName)
                                );
                                let listLevelTpl = '';
                                if (/H1$/i.test(styleName)) listLevelTpl = 'H1';
                                else if (/H2$/i.test(styleName)) listLevelTpl = 'H2';
                                else if (/H3$/i.test(styleName)) listLevelTpl = 'H3';

                                Array.from(node.childNodes).forEach(li => {
                                    if (li.nodeType !== Node.ELEMENT_NODE) return;
                                    const liName = li.localName || li.nodeName.replace(/^.*:/, '');
                                    if (liName === 'list-item') {
                                        const itemParts = [];
                                        let itemTpl = listLevelTpl;

                                        Array.from(li.childNodes).forEach(pNode => {
                                            if (pNode.nodeType === Node.ELEMENT_NODE) {
                                                const pLocal = pNode.localName || pNode.nodeName.replace(/^.*:/, '');
                                                const pStyleName = pNode.getAttribute('text:style-name') || '';
                                                const pSt = styleMap[pStyleName] || {};
                                                if (pLocal === 'h' || pSt.headingLevel > 0) {
                                                    const lvl = Math.min(3, Math.max(1, parseInt(pNode.getAttribute('text:outline-level') || pSt.headingLevel || '1', 10)));
                                                    itemTpl = `H${lvl}`;
                                                }
                                                itemParts.push(parseOdtInlineNodes(pNode, styleMap, false));
                                            }
                                        });
                                        const liHtml = itemParts.join('<br>').trim();
                                        if (liHtml) {
                                            if (['H1', 'H2', 'H3'].includes(itemTpl)) {
                                                const hTag = itemTpl.toLowerCase();
                                                listItems.push(`<li data-tpl="${itemTpl}"><${hTag}>${liHtml}</${hTag}></li>`);
                                            } else {
                                                listItems.push(`<li>${liHtml}</li>`);
                                            }
                                        }
                                    }
                                });
                                if (listItems.length > 0) {
                                    const listTag = isOrdered ? 'ol' : 'ul';
                                    htmlBlocks.push(`<${listTag}>${listItems.join('')}</${listTag}>`);
                                }
                                return;
                            }

                            // 4. Tabellen oder Sektionen rekursiv durchlaufen
                            if (localName === 'section' || localName === 'table' || localName === 'table-row' || localName === 'table-cell') {
                                processOdtContainer(node);
                                return;
                            }

                            // 5. Normale Textabsätze (<text:p>)
                            if (localName === 'p') {
                                const innerHtml = parseOdtInlineNodes(node, styleMap, false);
                                if (innerHtml.trim()) {
                                    htmlBlocks.push(`<p>${innerHtml}</p>`);
                                }
                            }
                        });
                    }

                    processOdtContainer(officeText);
                    flushPendingCodeBlock();

                    visualEditor.innerHTML = htmlBlocks.join('') || '<p><br></p>';
                    refreshHeadingListNumbering();
                    highlightAllCodeBlocks();
                    syncVisualToMarkdown();
                    updateActiveFormatState();
                    updateStats();
                    showToast(`"${file.name}" geöffnet`);
                } catch (err) {
                    console.error('ODT-Importfehler:', err);
                    showToast('Fehler beim Öffnen der ODT-Datei');
                }
            }

            function loadFileIntoEditor(file) {
                const baseName = file.name.replace(/\.(md|markdown|txt|odt)$/i, '');
                docFilename.value = baseName || 'Dokument';

                if (/\.odt$/i.test(file.name) || file.type === 'application/vnd.oasis.opendocument.text') {
                    loadOdtFileIntoEditor(file);
                    return;
                }

                const reader = new FileReader();
                reader.onload = (event) => {
                    const content = event.target.result || '';
                    const isMarkdown = /\.(md|markdown)$/i.test(file.name);

                    if (isMarkdown) {
                        markdownEditor.value = content;
                        updateMarkdownLineNumbers();
                        renderMarkdownToVisual(content);
                        showToast(`"${file.name}" geöffnet`);
                    } else {
                        const hasMarkdownFeatures = /(^#{1,3}\s|```|^-\s|\*\s|^\d+\.\s)/m.test(content);
                        if (hasMarkdownFeatures) {
                            markdownEditor.value = content;
                            renderMarkdownToVisual(content);
                        } else {
                            const paragraphs = content.split(/\r?\n\r?\n/);
                            const htmlParts = paragraphs.map(block => {
                                const trimmed = block.trim();
                                if (!trimmed) return '';
                                if (looksLikeProgrammingCode(trimmed)) {
                                    const escaped = escapeHtml(trimmed);
                                    return `<pre data-lang="AUTO"><code>${escaped}</code></pre>`;
                                }
                                const escapedLines = escapeHtml(trimmed).replace(/\r?\n/g, '<br>');
                                return `<p>${escapedLines}</p>`;
                            });
                            visualEditor.innerHTML = htmlParts.join('') || '<p><br></p>';
                            highlightAllCodeBlocks();
                            syncVisualToMarkdown();
                        }
                        showToast(`"${file.name}" geöffnet`);
                    }
                    updateStats();
                };
                reader.readAsText(file, 'UTF-8');
            }

            function looksLikeProgrammingCode(text) {
                const lines = text.split(/\r?\n/);
                if (lines.length < 2) return false;
                const codeIndicators = [
                    /^(function|const|let|var|import|export|class|def|public|private|if|for|while|return)\b/m,
                    /[{};]\s*$/m,
                    /=>|===|!==|\+=|console\.log|print\(|SELECT\s+.*\s+FROM/i,
                    /^<\/?[a-z][\s\S]*>/i
                ];
                let score = 0;
                codeIndicators.forEach(regex => {
                    if (regex.test(text)) score++;
                });
                return score >= 2;
            }

            function escapeHtml(str) {
                return str
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;');
            }

            function escapeXml(str) {
                return String(str || '')
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&apos;');
            }

            // Konvertiert Text mit Mehrfach-Leerzeichen und Tabs in ODF-konformes XML (<text:s/>, <text:tab/>)
            function formatOdfText(text) {
                const escaped = escapeXml(text);
                return escaped
                    .replace(/\t/g, '<text:tab/>')
                    .replace(/ {2,}/g, (match) => ' ' + `<text:s text:c="${match.length - 1}"/>`);
            }

            // Verarbeitet Inline-Knoten (Fett, Kursiv, Inline-Code, Zeilenumbrüche) für ODT
            function serializeInlineNodesToOdf(parentNode) {
                let xml = '';
                parentNode.childNodes.forEach(node => {
                    if (node.nodeType === Node.TEXT_NODE) {
                        xml += formatOdfText(node.nodeValue);
                    } else if (node.nodeType === Node.ELEMENT_NODE) {
                        const tag = node.tagName.toUpperCase();
                        if (tag === 'BR') {
                            xml += '<text:line-break/>';
                        } else if (tag === 'STRONG' || tag === 'B') {
                            const hasItalic = node.querySelector('em, i');
                            if (hasItalic && node.childNodes.length === 1) {
                                xml += `<text:span text:style-name="T_BoldItalic">${serializeInlineNodesToOdf(hasItalic)}</text:span>`;
                            } else {
                                xml += `<text:span text:style-name="T_Bold">${serializeInlineNodesToOdf(node)}</text:span>`;
                            }
                        } else if (tag === 'EM' || tag === 'I') {
                            const hasBold = node.querySelector('strong, b');
                            if (hasBold && node.childNodes.length === 1) {
                                xml += `<text:span text:style-name="T_BoldItalic">${serializeInlineNodesToOdf(hasBold)}</text:span>`;
                            } else {
                                xml += `<text:span text:style-name="T_Italic">${serializeInlineNodesToOdf(node)}</text:span>`;
                            }
                        } else if (tag === 'CODE') {
                            xml += `<text:span text:style-name="T_InlineCode">${formatOdfText(node.textContent)}</text:span>`;
                        } else {
                            xml += serializeInlineNodesToOdf(node);
                        }
                    }
                });
                return xml;
            }

            // Erzeugt den ODF-Body aus dem aktuellen Inhalt des visuellen Editors
            function buildOdtBodyXml() {
                if (currentViewMode === 'markdown') {
                    renderMarkdownToVisual(markdownEditor.value);
                }

                let bodyXml = '';
                const children = Array.from(visualEditor.childNodes);

                children.forEach(node => {
                    if (node.nodeType === Node.TEXT_NODE) {
                        const txt = node.nodeValue.trim();
                        if (txt) {
                            bodyXml += `<text:p text:style-name="Standard">${formatOdfText(txt)}</text:p>`;
                        }
                        return;
                    }
                    if (node.nodeType !== Node.ELEMENT_NODE) return;

                    const tag = node.tagName.toUpperCase();

                    if (tag === 'H1') {
                        bodyXml += `<text:h text:style-name="Heading_20_1" text:outline-level="1">${serializeInlineNodesToOdf(node)}</text:h>`;
                    } else if (tag === 'H2') {
                        bodyXml += `<text:h text:style-name="Heading_20_2" text:outline-level="2">${serializeInlineNodesToOdf(node)}</text:h>`;
                    } else if (tag === 'H3') {
                        bodyXml += `<text:h text:style-name="Heading_20_3" text:outline-level="3">${serializeInlineNodesToOdf(node)}</text:h>`;
                    } else if (tag === 'UL' || tag === 'OL') {
                        Array.from(node.children).forEach(li => {
                            if (!li.tagName || li.tagName.toUpperCase() !== 'LI') return;
                            const tpl = getEffectiveTemplate(li);
                            const contentTarget = li.querySelector('h1, h2, h3, p') || li;
                            const innerXml = serializeInlineNodesToOdf(contentTarget);

                            let listStyleName = tag === 'OL' ? 'L_Number' : 'L_Bullet';
                            let paraXml = `<text:p text:style-name="P_List">${innerXml}</text:p>`;

                            if (tpl === 'H1') {
                                listStyleName = tag === 'OL' ? 'L_Number_H1' : 'L_Bullet_H1';
                                paraXml = `<text:h text:style-name="Heading_20_1" text:outline-level="1">${innerXml}</text:h>`;
                            } else if (tpl === 'H2') {
                                listStyleName = tag === 'OL' ? 'L_Number_H2' : 'L_Bullet_H2';
                                paraXml = `<text:h text:style-name="Heading_20_2" text:outline-level="2">${innerXml}</text:h>`;
                            } else if (tpl === 'H3') {
                                listStyleName = tag === 'OL' ? 'L_Number_H3' : 'L_Bullet_H3';
                                paraXml = `<text:h text:style-name="Heading_20_3" text:outline-level="3">${innerXml}</text:h>`;
                            }

                            const continueAttr = tag === 'OL' ? ' text:continue-numbering="true"' : '';
                            bodyXml += `<text:list text:style-name="${listStyleName}"${continueAttr}><text:list-item>${paraXml}</text:list-item></text:list>`;
                        });
                    } else if (tag === 'PRE') {
                        const codeNode = node.querySelector('code') || node;
                        const lang = node.getAttribute('data-lang') || 'CODE';
                        const rawLines = codeNode.textContent.replace(/\n$/, '').split(/\r?\n/);
                        bodyXml += `<text:p text:style-name="Code_Header">[${escapeXml(lang)}]</text:p>`;
                        rawLines.forEach(line => {
                            bodyXml += `<text:p text:style-name="Code_Block">${formatOdfText(line)}</text:p>`;
                        });
                    } else {
                        const inner = serializeInlineNodesToOdf(node);
                        bodyXml += `<text:p text:style-name="Standard">${inner}</text:p>`;
                    }
                });

                if (!bodyXml) {
                    bodyXml = `<text:p text:style-name="Standard"/>`;
                }
                return bodyXml;
            }

            // Reiner JS-ZIP-Packer (Store-Methode mit CRC32) als Offline-Fallback, falls CDN nicht erreichbar
            function createStoredZipBlob(files) {
                const crcTable = new Uint32Array(256);
                for (let n = 0; n < 256; n++) {
                    let c = n;
                    for (let k = 0; k < 8; k++) {
                        c = (c & 1) ? (0xedb88320 ^ (c >>> 1)) : (c >>> 1);
                    }
                    crcTable[n] = c >>> 0;
                }
                function crc32(bytes) {
                    let crc = 0xffffffff;
                    for (let i = 0; i < bytes.length; i++) {
                        crc = crcTable[(crc ^ bytes[i]) & 0xff] ^ (crc >>> 8);
                    }
                    return (crc ^ 0xffffffff) >>> 0;
                }

                const encoder = new TextEncoder();
                const localParts = [];
                const centralParts = [];
                let offset = 0;

                files.forEach(file => {
                    const nameBytes = encoder.encode(file.name);
                    const dataBytes = encoder.encode(file.content);
                    const crc = crc32(dataBytes);
                    const size = dataBytes.length;

                    const localHeader = new Uint8Array(30 + nameBytes.length);
                    const lv = new DataView(localHeader.buffer);
                    lv.setUint32(0, 0x04034b50, true);
                    lv.setUint16(4, 20, true);
                    lv.setUint16(6, 0x0800, true); // UTF-8
                    lv.setUint16(8, 0, true);      // Store (uncompressed)
                    lv.setUint16(10, 0, true);
                    lv.setUint16(12, 0x2100, true);
                    lv.setUint32(14, crc, true);
                    lv.setUint32(18, size, true);
                    lv.setUint32(22, size, true);
                    lv.setUint16(26, nameBytes.length, true);
                    lv.setUint16(28, 0, true);
                    localHeader.set(nameBytes, 30);

                    const centralHeader = new Uint8Array(46 + nameBytes.length);
                    const cv = new DataView(centralHeader.buffer);
                    cv.setUint32(0, 0x02014b50, true);
                    cv.setUint16(4, 20, true);
                    cv.setUint16(6, 20, true);
                    cv.setUint16(8, 0x0800, true);
                    cv.setUint16(10, 0, true);
                    cv.setUint16(12, 0, true);
                    cv.setUint16(14, 0x2100, true);
                    cv.setUint32(16, crc, true);
                    cv.setUint32(20, size, true);
                    cv.setUint32(24, size, true);
                    cv.setUint16(28, nameBytes.length, true);
                    cv.setUint16(30, 0, true);
                    cv.setUint16(32, 0, true);
                    cv.setUint16(34, 0, true);
                    cv.setUint16(36, 0, true);
                    cv.setUint32(38, 0, true);
                    cv.setUint32(42, offset, true);
                    centralHeader.set(nameBytes, 46);

                    localParts.push(localHeader, dataBytes);
                    centralParts.push(centralHeader);
                    offset += localHeader.length + size;
                });

                const centralSize = centralParts.reduce((acc, part) => acc + part.length, 0);
                const eocd = new Uint8Array(22);
                const ev = new DataView(eocd.buffer);
                ev.setUint32(0, 0x06054b50, true);
                ev.setUint16(4, 0, true);
                ev.setUint16(6, 0, true);
                ev.setUint16(8, files.length, true);
                ev.setUint16(10, files.length, true);
                ev.setUint32(12, centralSize, true);
                ev.setUint32(16, offset, true);
                ev.setUint16(20, 0, true);

                return new Blob([...localParts, ...centralParts, eocd], {
